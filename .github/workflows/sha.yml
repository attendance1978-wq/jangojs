name: Generate SHA Checksums

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  generate-sha:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Use Node.js 22 LTS or 24
          
      - name: Generate SHA256 checksums
        run: |
          echo "{" > sha.json
          find . -type f -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./.github/*" | sort | while read file; do
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            # Escape special characters in filename for JSON
            safe_file=$(echo "$file" | sed 's/^\.\///' | sed 's/"/\\"/g')
            echo "  \"$safe_file\": \"$sha\"," >> sha.json
          done
          # Remove trailing comma and close JSON
          sed -i '$ s/,$//' sha.json
          echo "}" >> sha.json
          
      - name: Upload SHA JSON
        uses: actions/upload-artifact@v4
        with:
          name: sha-checksums
          path: sha.json
          
      - name: Attach to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./sha.json
          asset_name: sha.json
          asset_content_type: application/json
