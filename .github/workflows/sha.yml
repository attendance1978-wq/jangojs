name: Generate SHA Checksums

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  generate-sha:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Better compatibility with newer Node.js
          fetch-depth: 1
          
      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          
      - name: Generate SHA256 checksums
        id: generate
        run: |
          # Create JSON with proper escaping
          echo '{' > sha.json
          first=true
          find . -type f -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./.github/*" -not -path "./.vscode/*" | sort | while read file; do
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            # Remove leading ./
            safe_file="${file#./}"
            # Escape backslashes and quotes for JSON
            safe_file=$(printf '%s' "$safe_file" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
            if [ "$first" = true ]; then
              echo "  \"$safe_file\": \"$sha\"" >> sha.json
              first=false
            else
              echo ", \"$safe_file\": \"$sha\"" >> sha.json
            fi
          done
          echo '}' >> sha.json
          
          echo "Generated sha.json with $(jq '. | length' sha.json) entries"
          
      - name: Validate JSON
        run: |
          if jq empty sha.json 2>/dev/null; then
            echo "✅ JSON is valid"
          else
            echo "❌ JSON is invalid"
            jq . sha.json
            exit 1
          fi
          
      - name: Upload SHA JSON
        uses: actions/upload-artifact@v4
        with:
          name: sha-checksums
          path: sha.json
          if-no-files-found: error
          
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: sha.json
          append_body: true
          body: |
            ### SHA Checksums
            `sha.json` file with checksums for all files in this release.
