<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}jangojs blog{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; background: #0f1115; color: #eee; line-height: 1.5; }
    a { color: #6cf; }
    .post { border-bottom: 1px solid #333; padding: 1rem 0; }
    textarea, input[type=text] { width: 100%; padding: 0.5rem; margin: 0.3rem 0; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <header><h1><a href="/">jangojs blog</a></h1></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
